server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # ── User Service ────────────────────────────────────────────────────
        - id: user-service-auth
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-users
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthFilter

        # ── Event Service ────────────────────────────────────────────────────
        - id: event-service-public
          uri: http://event-service:8082
          predicates:
            - Path=/api/v1/events/**
            - Method=GET

        - id: event-service-protected
          uri: http://event-service:8082
          predicates:
            - Path=/api/v1/events/**
            - Method=POST,PUT,PATCH,DELETE
          filters:
            - name: JwtAuthFilter

        # ── Ticket Service ───────────────────────────────────────────────────
        - id: ticket-service
          uri: http://ticket-service:8083
          predicates:
            - Path=/api/v1/tickets/**
          filters:
            - name: JwtAuthFilter

        # ── Notification Service ─────────────────────────────────────────────
        - id: notification-service
          uri: http://notification-service:8084
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/chat/**
          filters:
            - name: JwtAuthFilter

        # ── WebSocket ────────────────────────────────────────────────────────
        - id: websocket
          uri: http://notification-service:8084
          predicates:
            - Path=/ws/**

management:
  endpoints:
    web:
      exposure:
        include: health,routes

app:
  jwt:
    # Doit être exactement le même secret partout !
    secret: eventcollab-super-secret-key-must-be-at-least-256-bits-long-for-security

logging:
  level:
    com.eventcollab: INFO
    org.springframework.cloud.gateway: INFO